name: Build Router Firmware

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - release
          - prerelease
      release_notes:
        description: 'Release Notes'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 10

      - name: Get current date
        id: date
        run: |
          echo "date=$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Get commit hash
        id: commit
        run: |
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "full=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache downloads
        uses: actions/cache@v5
        with:
          path: dl
          key: xr1710g-dl-${{ hashFiles('feeds.conf.default', 'config.seed') }}
          restore-keys: |
            xr1710g-dl-

      - name: Build container image
        run: |
          docker build \
            --tag xr1710g-openwrt-builder:ubuntu-24.04 \
            tools/docker/openwrt-build

      - name: Import packages and install feeds
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            xr1710g-openwrt-builder:ubuntu-24.04 \
            bash -lc '
              ./scripts/import-migration-packages.sh
              ./scripts/feeds update -a
              ./scripts/feeds install -a
            '

      - name: Test configuration validation
        run: ./tests/validate-config-selection.sh

      - name: Configure
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            xr1710g-openwrt-builder:ubuntu-24.04 \
            bash -lc '
              cp config.seed .config
              make defconfig
              ./scripts/validate-config-selection.sh config.seed .config
            '

      - name: Download sources
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            xr1710g-openwrt-builder:ubuntu-24.04 \
            bash -lc 'make download -j"$(nproc)"'

      - name: Build Firmware
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            xr1710g-openwrt-builder:ubuntu-24.04 \
            bash -o pipefail -lc 'make -j"$(nproc)" world 2>&1 | tee build.log'

      - name: Validate build
        run: |
          ./scripts/validate-migration-firmware.sh
          ls -lh bin/targets/airoha/an7581

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: router-firmware
          path: |
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/version.buildinfo
            bin/targets/airoha/an7581/sha256sums
            bin/targets/airoha/an7581/profiles.json
            bin/targets/airoha/an7581/*.manifest
            bin/packages/aarch64_cortex-a53/base/luci-app-mwan3helper-*.apk
            bin/packages/aarch64_cortex-a53/base/luci-i18n-mwan3helper-zh-cn-*.apk
            bin/packages/aarch64_cortex-a53/base/pdnsd-alt-*.apk
          retention-days: 30

      - name: Create Release
        if: github.event.inputs.release_type != 'none'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ format('{0}-{1}', steps.date.outputs.date, steps.commit.outputs.short) }}
          name: ${{ format('{0} - XR1710G Build ({1})', steps.date.outputs.date, steps.commit.outputs.short) }}
          body: ${{ github.event.inputs.release_notes }}
          draft: false
          prerelease: ${{ github.event.inputs.release_type == 'prerelease' }}
          files: |
            bin/targets/airoha/an7581/*.itb
            bin/targets/airoha/an7581/config.buildinfo
            bin/targets/airoha/an7581/feeds.buildinfo
            bin/targets/airoha/an7581/version.buildinfo
            bin/targets/airoha/an7581/sha256sums
            bin/targets/airoha/an7581/profiles.json
            bin/targets/airoha/an7581/*.manifest
            bin/packages/aarch64_cortex-a53/base/luci-app-mwan3helper-*.apk
            bin/packages/aarch64_cortex-a53/base/luci-i18n-mwan3helper-zh-cn-*.apk
            bin/packages/aarch64_cortex-a53/base/pdnsd-alt-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
